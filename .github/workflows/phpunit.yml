# M1 — núcleo portável em CI (PHPUnit sem boot do sítio)
name: PHPUnit

on:
  push:
    paths:
      - 'relatasoft-secure-election-suite/**'
      - '.github/workflows/phpunit.yml'
  pull_request:
    paths:
      - 'relatasoft-secure-election-suite/**'
      - '.github/workflows/phpunit.yml'

defaults:
  run:
    working-directory: relatasoft-secure-election-suite

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: relatasoft-secure-election-suite/vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('relatasoft-secure-election-suite/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit (sem sítio / sem WordPress)
        run: composer test

      - name: Piloto Adapter #2 smoke (M6)
        if: matrix.php == '8.3'
        run: php bin/ve-node pilot --root="${RUNNER_TEMP}/ve-piloto-ci" --votes=2
