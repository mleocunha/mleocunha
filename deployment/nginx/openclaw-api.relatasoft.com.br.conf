server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openclaw-api.relatasoft.com.br;

    # ssl_certificate /etc/letsencrypt/live/openclaw-api.relatasoft.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/openclaw-api.relatasoft.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 256k;
    client_body_timeout 30s;

    access_log /var/log/nginx/openclaw-api.access.log;
    error_log  /var/log/nginx/openclaw-api.error.log;

    location /v1/device/connect {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_except GET POST HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name openclaw-api.relatasoft.com.br;
    return 301 https://$host$request_uri;
}
