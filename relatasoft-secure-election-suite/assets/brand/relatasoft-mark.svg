<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RelataSoft">
  <defs>
    <linearGradient id="rsesMarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE56A"/>
      <stop offset="48%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#F58220"/>
    </linearGradient>
  </defs>
  <!-- 6-fold RelataSoft pinwheel -->
  <g fill="url(#rsesMarkGold)" transform="translate(64 64)">
